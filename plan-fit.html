<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">计费拟合样本提交</title>
    <link rel="icon" href="/favicon.ico?v=260418" type="image/x-icon">
    <link rel="stylesheet" href="styles/shared.css">
    <script src="scripts/plan-fit-config.local.js"></script>
    <script src="scripts/plan-fit-config.js"></script>
    <script src="scripts/shared.js"></script>
    <style>
        .header .subtitle {
            margin-bottom: 10px;
        }

        .intro-card,
        .submit-card,
        .result-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
        }

        .intro-card {
            padding: 24px 28px;
            margin-bottom: 28px;
        }

        .intro-card p {
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 10px;
        }

        .intro-card p:last-child {
            margin-bottom: 0;
        }

        .submit-card {
            padding: 30px 32px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px 20px;
        }

        .selection-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px 20px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-group.full-width {
            grid-column: 1 / -1;
        }

        .field-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .field-help {
            font-size: 12px;
            color: var(--text-tertiary);
            line-height: 1.5;
        }

        .form-input,
        .form-textarea,
        .form-select-trigger {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            font-family: inherit;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select-trigger:focus,
        .multi-select.open .form-select-trigger {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-textarea {
            min-height: 92px;
            resize: vertical;
            line-height: 1.6;
        }

        .multi-select {
            position: relative;
        }

        .form-select-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            text-align: left;
            cursor: pointer;
        }

        .form-select-trigger:disabled {
            cursor: not-allowed;
            color: var(--text-tertiary);
            background: var(--bg-secondary);
            opacity: 0.85;
        }

        .form-select-trigger::after {
            content: '▾';
            color: var(--text-tertiary);
            flex-shrink: 0;
        }

        .multi-select.open .form-select-trigger::after {
            content: '▴';
        }

        .multi-select-label {
            min-height: 22px;
            line-height: 1.5;
            color: var(--text-primary);
        }

        .multi-select-label.placeholder {
            color: var(--text-tertiary);
        }

        .multi-select-panel {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            z-index: 20;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            box-shadow: var(--shadow-md);
            display: none;
        }

        .multi-select.open .multi-select-panel {
            display: block;
        }

        .multi-select-actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .multi-select-action {
            border: none;
            background: transparent;
            color: var(--accent-primary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
        }

        .multi-select-options {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .multi-select-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-primary);
        }

        .multi-select-option:hover {
            background: var(--bg-secondary);
        }

        .single-select-option {
            width: 100%;
            border: none;
            background: transparent;
            text-align: left;
            font: inherit;
        }

        .single-select-option.selected {
            background: rgba(99, 102, 241, 0.08);
            color: var(--accent-primary);
        }

        .multi-select-empty {
            color: var(--text-tertiary);
            font-size: 13px;
            padding: 10px;
        }

        .submit-row {
            margin-top: 26px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .submit-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 30px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .submit-note {
            color: var(--text-tertiary);
            font-size: 13px;
            line-height: 1.6;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .result-card {
            margin-top: 24px;
            padding: 18px 20px;
            display: none;
        }

        .result-card.success {
            border-color: rgba(16, 185, 129, 0.28);
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.06), rgba(16, 185, 129, 0.02));
        }

        .result-card.error {
            border-color: rgba(239, 68, 68, 0.28);
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.06), rgba(239, 68, 68, 0.02));
        }

        .result-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .result-card.success .result-title {
            color: var(--accent-success);
        }

        .result-card.error .result-title {
            color: var(--accent-error);
        }

        .result-body {
            color: var(--text-secondary);
            line-height: 1.7;
            font-size: 14px;
        }

        .meta-list {
            margin-top: 12px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .meta-pill {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 5px 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            body { padding: 24px 16px; }
            .submit-card,
            .intro-card,
            .result-card { padding: 20px; }
            .form-grid { grid-template-columns: 1fr; }
            .selection-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="page-nav">
            <a href="index.html" class="page-tab" id="navHome">国内 Coding Plan</a>
            <a href="relays.html" class="page-tab" id="navRelays">API 中转站</a>
            <a href="relay-detect.html" class="page-tab" id="navRelayDetect">中转站检测</a>
            <a href="plan-fit.html" class="page-tab active" id="navPlanFit">计费拟合样本</a>
            <div class="settings-wrapper">
                <button class="settings-btn" id="settingsBtn" title="设置" aria-label="设置">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
                <div class="settings-panel" id="settingsPanel" hidden>
                    <div class="settings-panel-title">显示设置</div>
                    <div class="settings-toggle-row">
                        <label for="ultraWideToggle">超宽屏模式</label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="ultraWideToggle">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </nav>

        <div class="header">
            <a href="https://github.com/wmpeng/codingplan" target="_blank" rel="noopener noreferrer" class="github-link">
                <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                <span>GitHub</span>
            </a>
            <h1 id="headerTitle">计费拟合样本提交</h1>
            <p class="subtitle" id="headerSubtitle">提交你在厂商套餐中的实际消耗样本，帮助后端逐步拟合更接近真实的隐藏计费规则。</p>
        </div>

        <div class="intro-card" id="introCard">
            <p id="introParagraph1">当前页面只负责收集样本，不会立刻给出推测结果。后端会把同厂商、同套餐的样本合并后再做稳健统计与置信判断。</p>
            <p id="introParagraph2">厂商、套餐、模型默认从现有套餐数据里给出建议，但都支持自定义输入，适合补录新平台或未收录型号。</p>
        </div>

        <div class="submit-card">
            <div class="section-title" id="formSectionTitle">提交样本</div>
            <form id="planFitForm" autocomplete="off">
                <div class="form-grid">
                    <div class="field-group full-width">
                        <div class="selection-row">
                            <div class="field-group">
                                <label class="field-label" for="vendorInput" id="vendorLabel">厂商</label>
                                <div class="multi-select" id="vendorSelect">
                                    <button class="form-select-trigger" id="vendorInput" type="button" aria-expanded="false" aria-controls="vendorOptionsPanel">
                                        <span class="multi-select-label placeholder" id="vendorInputLabel">请选择厂商</span>
                                    </button>
                                    <div class="multi-select-panel" id="vendorOptionsPanel" hidden>
                                        <div class="multi-select-options" id="vendorOptions"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="field-group">
                                <label class="field-label" for="planInput" id="planLabel">套餐</label>
                                <div class="multi-select" id="planSelect">
                                    <button class="form-select-trigger" id="planInput" type="button" aria-expanded="false" aria-controls="planOptionsPanel" disabled>
                                        <span class="multi-select-label placeholder" id="planInputLabel">请先选择厂商</span>
                                    </button>
                                    <div class="multi-select-panel" id="planOptionsPanel" hidden>
                                        <div class="multi-select-options" id="planOptions"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="field-group">
                                <label class="field-label" for="modelInput" id="modelLabel">模型列表</label>
                                <div class="multi-select" id="modelSelect">
                                    <button class="form-select-trigger" id="modelInput" type="button" aria-expanded="false" aria-controls="modelOptionsPanel" disabled>
                                        <span class="multi-select-label placeholder" id="modelInputLabel">请先选择套餐</span>
                                    </button>
                                    <div class="multi-select-panel" id="modelOptionsPanel" hidden>
                                        <div class="multi-select-actions">
                                            <button class="multi-select-action" id="selectAllModelsBtn" type="button">全选</button>
                                            <button class="multi-select-action" id="clearModelsBtn" type="button">清空</button>
                                        </div>
                                        <div class="multi-select-options" id="modelOptions"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="field-help" id="modelHelp">像下拉框一样展开后可多选，提交时会一并写入模型列表。</div>
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="windowStartInput" id="windowStartLabel">近 5 小时计费开始时间</label>
                        <input class="form-input" id="windowStartInput" placeholder="yyyyMMdd hh:mm:ss，例如 20260502 12:00:00">
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="usagePercentInput" id="usagePercentLabel">近 5 小时套餐消耗百分比</label>
                        <input class="form-input" id="usagePercentInput" type="number" min="0.01" max="100" step="0.01" placeholder="例如 17.5" required>
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="readTokensInput" id="readTokensLabel">Read Token（千 Token）</label>
                        <input class="form-input" id="readTokensInput" type="number" min="0" step="0.1" placeholder="例如 250，表示 25 万 token" required>
                        <div class="field-help" id="readTokensHelp">这里不包含缓存命中的输入 token，提交时会自动按 1000 倍换算。</div>
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="cacheHitTokensInput" id="cacheHitTokensLabel">缓存命中 Token（千 Token）</label>
                        <input class="form-input" id="cacheHitTokensInput" type="number" min="0" step="0.1" placeholder="例如 250，表示 25 万 token" required>
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="writeTokensInput" id="writeTokensLabel">Write Token（千 Token）</label>
                        <input class="form-input" id="writeTokensInput" type="number" min="0" step="0.1" placeholder="例如 18，表示 1.8 万 token" required>
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="requestCountInput" id="requestCountLabel">请求总次数</label>
                        <input class="form-input" id="requestCountInput" type="number" min="0" step="1" placeholder="例如 87" required>
                    </div>
                </div>
                <div class="submit-row">
                    <button class="submit-btn" id="submitBtn" type="submit">提交样本</button>
                    <div class="submit-note" id="submitNote">提交后仅会提示收集成功；聚合展示页会后续单独上线。</div>
                </div>
            </form>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-title" id="resultTitle"></div>
            <div class="result-body" id="resultBody"></div>
            <div class="meta-list" id="resultMeta"></div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        var API_BASE = (window.PLAN_FIT_CONFIG && window.PLAN_FIT_CONFIG.apiBase) || '';
        var planRows = [];
        var pageContent = null;
        var selectedVendor = '';
        var selectedPlan = '';
        var vendorInput = document.getElementById('vendorInput');
        var vendorInputLabel = document.getElementById('vendorInputLabel');
        var vendorSelect = document.getElementById('vendorSelect');
        var vendorOptionsPanel = document.getElementById('vendorOptionsPanel');
        var vendorOptions = document.getElementById('vendorOptions');
        var planInput = document.getElementById('planInput');
        var planInputLabel = document.getElementById('planInputLabel');
        var planSelect = document.getElementById('planSelect');
        var planOptionsPanel = document.getElementById('planOptionsPanel');
        var planOptions = document.getElementById('planOptions');
        var modelInput = document.getElementById('modelInput');
        var modelInputLabel = document.getElementById('modelInputLabel');
        var modelSelect = document.getElementById('modelSelect');
        var modelOptionsPanel = document.getElementById('modelOptionsPanel');
        var modelOptions = document.getElementById('modelOptions');
        var selectAllModelsBtn = document.getElementById('selectAllModelsBtn');
        var clearModelsBtn = document.getElementById('clearModelsBtn');
        var form = document.getElementById('planFitForm');
        var submitBtn = document.getElementById('submitBtn');
        var resultCard = document.getElementById('resultCard');
        var resultTitle = document.getElementById('resultTitle');
        var resultBody = document.getElementById('resultBody');
        var resultMeta = document.getElementById('resultMeta');

        Promise.all([
            fetch('plans.json').then(function(resp) { return resp.json(); }),
            fetch('plan-fit-content.json').then(function(resp) { return resp.json(); })
        ])
            .then(function(results) {
                planRows = Array.isArray(results[0]) ? results[0] : [];
                pageContent = results[1] || {};
                applyPageContent(pageContent);
                renderVendorOptions();
                syncDependentOptions();
            })
            .catch(function(err) {
                console.warn('failed to load plan-fit resources', err);
            });

        vendorInput.addEventListener('click', function(event) {
            toggleDropdown(event, vendorSelect, vendorInput, vendorOptionsPanel, false);
        });
        planInput.addEventListener('click', function(event) {
            toggleDropdown(event, planSelect, planInput, planOptionsPanel, !selectedVendor);
        });
        modelInput.addEventListener('click', function(event) {
            toggleDropdown(event, modelSelect, modelInput, modelOptionsPanel, !selectedVendor || !selectedPlan);
        });
        vendorOptions.addEventListener('click', handleVendorSelect);
        planOptions.addEventListener('click', handlePlanSelect);
        selectAllModelsBtn.addEventListener('click', selectAllModels);
        clearModelsBtn.addEventListener('click', clearSelectedModels);
        document.addEventListener('click', handleDocumentClick);

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            var vendor = selectedVendor;
            var plan = selectedPlan;
            var windowStartStr = document.getElementById('windowStartInput').value.trim();
            var fiveHourUsagePercent = Number(document.getElementById('usagePercentInput').value);
            var readTokens = parseKTokenInput('readTokensInput');
            var cacheHitTokens = parseKTokenInput('cacheHitTokensInput');
            var writeTokens = parseKTokenInput('writeTokensInput');
            var requestCount = Number(document.getElementById('requestCountInput').value);

            if (!vendor || !plan) {
                showResult('error', getMessage('submitFailedTitle', '提交失败'), getMessage('vendorPlanRequired', '厂商和套餐都不能为空。'));
                return;
            }
            if (!Number.isFinite(fiveHourUsagePercent) || fiveHourUsagePercent <= 0 || fiveHourUsagePercent > 100) {
                showResult('error', getMessage('submitFailedTitle', '提交失败'), getMessage('usagePercentInvalid', '近 5 小时套餐消耗百分比必须在 0 到 100 之间。'));
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span>提交中';

            fetch(API_BASE + '/plan_fit/submissions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    vendor: vendor,
                    plan: plan,
                    model_list: getSelectedModelList(),
                    window_start_str: windowStartStr,
                    five_hour_usage_percent: fiveHourUsagePercent,
                    read_tokens: readTokens,
                    cache_hit_tokens: cacheHitTokens,
                    write_tokens: writeTokens,
                    request_count: requestCount
                })
            })
            .then(function(resp) {
                return resp.json().then(function(data) {
                    return { ok: resp.ok, data: data };
                });
            })
            .then(function(result) {
                if (!result.ok || result.data.err_code) {
                    throw new Error(resolveErrorMessage(result.data));
                }

                form.reset();
                selectedVendor = '';
                selectedPlan = '';
                syncDependentOptions();
                closeAllDropdowns();
                showResult(
                    'success',
                    getMessage('submitSuccessTitle', '样本已提交'),
                    getMessage('submitSuccessBody', '该样本已经入库，后续会与同厂商、同套餐的其它样本一起参与统计。'),
                    [
                        getMessage('recordIdPrefix', '记录 ID: ') + result.data.data.id,
                        getMessage('vendorPrefix', '厂商: ') + result.data.data.vendor,
                        getMessage('planPrefix', '套餐: ') + result.data.data.plan
                    ]
                );
            })
            .catch(function(err) {
                showResult('error', getMessage('submitFailedTitle', '提交失败'), err.message || getMessage('submitGeneric', '提交过程中发生错误。'));
            })
            .finally(function() {
                submitBtn.disabled = false;
                submitBtn.textContent = getFormText('submitButton', '提交样本');
            });
        });

        function applyPageContent(content) {
            var nav = content.nav || {};
            var header = content.header || {};
            var formText = content.form || {};
            var intro = Array.isArray(content.intro) ? content.intro : [];

            setText('pageTitle', content.pageTitle || '计费拟合样本提交');
            setText('navHome', nav.home || '国内 Coding Plan');
            setText('navRelays', nav.relays || 'API 中转站');
            setText('navRelayDetect', nav.relayDetect || '中转站检测');
            setText('navPlanFit', nav.planFit || '计费拟合样本');
            setText('headerTitle', header.title || '计费拟合样本提交');
            setText('headerSubtitle', header.subtitle || '');
            setText('introParagraph1', intro[0] || '');
            setText('introParagraph2', intro[1] || '');
            setText('formSectionTitle', formText.sectionTitle || '提交样本');
            setText('vendorLabel', formText.vendorLabel || '厂商');
            setText('planLabel', formText.planLabel || '套餐');
            setText('modelLabel', formText.modelLabel || '模型列表');
            setText('modelHelp', formText.modelHelp || '');
            setText('selectAllModelsBtn', formText.modelSelectAll || '全选');
            setText('clearModelsBtn', formText.modelClear || '清空');
            setText('windowStartLabel', formText.windowStartLabel || '近 5 小时计费开始时间');
            setText('usagePercentLabel', formText.usagePercentLabel || '近 5 小时套餐消耗百分比');
            setText('readTokensLabel', formText.readTokensLabel || 'Read Token（千 Token）');
            setText('readTokensHelp', formText.readTokensHelp || '');
            setText('cacheHitTokensLabel', formText.cacheHitTokensLabel || '缓存命中 Token（千 Token）');
            setText('writeTokensLabel', formText.writeTokensLabel || 'Write Token（千 Token）');
            setText('requestCountLabel', formText.requestCountLabel || '请求总次数');
            setText('submitBtn', formText.submitButton || '提交样本');
            setText('submitNote', formText.submitNote || '');

            setPlaceholder('windowStartInput', formText.windowStartPlaceholder || '');
            setPlaceholder('usagePercentInput', formText.usagePercentPlaceholder || '');
            setPlaceholder('readTokensInput', formText.readTokensPlaceholder || '');
            setPlaceholder('cacheHitTokensInput', formText.cacheHitTokensPlaceholder || '');
            setPlaceholder('writeTokensInput', formText.writeTokensPlaceholder || '');
            setPlaceholder('requestCountInput', formText.requestCountPlaceholder || '');
        }

        function renderVendorOptions() {
            var seen = {};
            var options = [];
            planRows.forEach(function(item) {
                var vendor = (item.vendor || '').trim();
                if (vendor && !seen[vendor]) {
                    seen[vendor] = true;
                    options.push(vendor);
                }
            });
            vendorOptions.innerHTML = options.sort().map(function(item) {
                var selected = item === selectedVendor ? ' selected' : '';
                return '<button class="multi-select-option single-select-option' + selected + '" type="button" data-value="' + encodeURIComponent(item) + '">' + escapeHtml(item) + '</button>';
            }).join('');
        }

        function syncDependentOptions() {
            var planList = collectPlanOptions(selectedVendor);
            var modelList;
            var selectedModels = getSelectedModelList();

            if (selectedPlan && planList.indexOf(selectedPlan) < 0) {
                selectedPlan = '';
            }
            if (!selectedVendor) {
                selectedPlan = '';
            }

            planOptions.innerHTML = planList.length ? planList.map(function(item) {
                var selected = item === selectedPlan ? ' selected' : '';
                return '<button class="multi-select-option single-select-option' + selected + '" type="button" data-value="' + encodeURIComponent(item) + '">' + escapeHtml(item) + '</button>';
            }).join('') : '<div class="multi-select-empty">' + escapeHtml(getFormText('planDisabledPlaceholder', '请先选择厂商')) + '</div>';

            modelList = selectedVendor && selectedPlan ? collectModelOptions(selectedVendor, selectedPlan) : [];
            selectedModels = selectedModels.filter(function(item) {
                return modelList.indexOf(item) >= 0;
            });

            modelOptions.innerHTML = modelList.length ? modelList.map(function(item, index) {
                var optionId = 'model-option-' + index;
                var checked = selectedModels.indexOf(item) >= 0 ? ' checked' : '';
                return '<label class="multi-select-option" for="' + optionId + '">'
                    + '<input type="checkbox" id="' + optionId + '" value="' + escapeHtml(item) + '"' + checked + '>'
                    + '<span>' + escapeHtml(item) + '</span>'
                    + '</label>';
            }).join('') : '<div class="multi-select-empty">' + escapeHtml(getFormText('modelEmpty', '当前厂商和套餐下暂无预置模型')) + '</div>';

            Array.prototype.slice.call(modelOptions.querySelectorAll('input[type="checkbox"]')).forEach(function(checkbox) {
                checkbox.addEventListener('change', updateModelLabel);
            });

            updateSelectionLabels();
            updateModelLabel();
        }

        function collectPlanOptions(vendor) {
            var seen = {};
            return planRows
                .filter(function(item) {
                    return !vendor || (item.vendor || '').trim() === vendor;
                })
                .map(function(item) { return (item.plan || '').trim(); })
                .filter(function(item) {
                    if (!item || seen[item]) return false;
                    seen[item] = true;
                    return true;
                })
                .sort();
        }

        function collectModelOptions(vendor, plan) {
            var seen = {};
            var rows = planRows.filter(function(item) {
                var vendorMatch = !vendor || (item.vendor || '').trim() === vendor;
                var planMatch = !plan || (item.plan || '').trim() === plan;
                return vendorMatch && planMatch;
            });
            return rows
                .flatMap(function(item) { return Array.isArray(item.models) ? item.models : []; })
                .map(function(item) { return String(item || '').trim(); })
                .filter(function(item) {
                    if (!item || seen[item]) return false;
                    seen[item] = true;
                    return true;
                })
                .sort();
        }

        function getSelectedModelList() {
            return Array.prototype.slice.call(modelOptions.querySelectorAll('input[type="checkbox"]:checked'))
                .map(function(option) { return String(option.value || '').trim(); })
                .filter(function(item) { return item.length > 0; });
        }

        function updateSelectionLabels() {
            if (selectedVendor) {
                vendorInputLabel.textContent = selectedVendor;
                vendorInputLabel.classList.remove('placeholder');
            } else {
                vendorInputLabel.textContent = getFormText('vendorPlaceholder', '请选择厂商');
                vendorInputLabel.classList.add('placeholder');
            }

            if (selectedPlan) {
                planInputLabel.textContent = selectedPlan;
                planInputLabel.classList.remove('placeholder');
            } else if (!selectedVendor) {
                planInputLabel.textContent = getFormText('planDisabledPlaceholder', '请先选择厂商');
                planInputLabel.classList.add('placeholder');
            } else {
                planInputLabel.textContent = getFormText('planPlaceholder', '请选择套餐');
                planInputLabel.classList.add('placeholder');
            }

            planInput.disabled = !selectedVendor;
            modelInput.disabled = !selectedVendor || !selectedPlan;
        }

        function updateModelLabel() {
            var selectedModels = getSelectedModelList();
            if (!selectedModels.length) {
                if (!selectedVendor) {
                    modelInputLabel.textContent = getFormText('modelDisabledVendorPlaceholder', '请先选择厂商');
                } else if (!selectedPlan) {
                    modelInputLabel.textContent = getFormText('modelDisabledPlanPlaceholder', '请先选择套餐');
                } else {
                    modelInputLabel.textContent = getFormText('modelPlaceholder', '请选择一个或多个模型');
                }
                modelInputLabel.classList.add('placeholder');
                return;
            }
            modelInputLabel.textContent = selectedModels.join('，');
            modelInputLabel.classList.remove('placeholder');
        }

        function toggleDropdown(event, selectRoot, trigger, panel, isDisabled) {
            event.preventDefault();
            if (isDisabled) {
                return;
            }
            if (selectRoot.classList.contains('open')) {
                closeDropdown(selectRoot, trigger, panel);
                return;
            }
            closeAllDropdowns();
            selectRoot.classList.add('open');
            panel.hidden = false;
            trigger.setAttribute('aria-expanded', 'true');
        }

        function closeDropdown(selectRoot, trigger, panel) {
            selectRoot.classList.remove('open');
            panel.hidden = true;
            trigger.setAttribute('aria-expanded', 'false');
        }

        function closeAllDropdowns() {
            closeDropdown(vendorSelect, vendorInput, vendorOptionsPanel);
            closeDropdown(planSelect, planInput, planOptionsPanel);
            closeDropdown(modelSelect, modelInput, modelOptionsPanel);
        }

        function handleDocumentClick(event) {
            if (!vendorSelect.contains(event.target) && !planSelect.contains(event.target) && !modelSelect.contains(event.target)) {
                closeAllDropdowns();
            }
        }

        function handleVendorSelect(event) {
            var option = event.target.closest('.single-select-option');
            if (!option) {
                return;
            }
            selectedVendor = decodeURIComponent(option.getAttribute('data-value') || '');
            selectedPlan = '';
            closeAllDropdowns();
            syncDependentOptions();
        }

        function handlePlanSelect(event) {
            var option = event.target.closest('.single-select-option');
            if (!option || !selectedVendor) {
                return;
            }
            selectedPlan = decodeURIComponent(option.getAttribute('data-value') || '');
            closeAllDropdowns();
            syncDependentOptions();
        }

        function selectAllModels() {
            Array.prototype.slice.call(modelOptions.querySelectorAll('input[type="checkbox"]')).forEach(function(checkbox) {
                checkbox.checked = true;
            });
            updateModelLabel();
        }

        function clearSelectedModels() {
            Array.prototype.slice.call(modelOptions.querySelectorAll('input[type="checkbox"]')).forEach(function(checkbox) {
                checkbox.checked = false;
            });
            updateModelLabel();
        }

        function parseKTokenInput(inputId) {
            var value = Number(document.getElementById(inputId).value);
            if (!Number.isFinite(value) || value < 0) {
                return 0;
            }
            return Math.round(value * 1000);
        }

        function getFormText(key, fallback) {
            if (pageContent && pageContent.form && typeof pageContent.form[key] === 'string') {
                return pageContent.form[key];
            }
            return fallback;
        }

        function getMessage(key, fallback) {
            if (pageContent && pageContent.messages && typeof pageContent.messages[key] === 'string') {
                return pageContent.messages[key];
            }
            return fallback;
        }

        function setText(id, value) {
            var element = document.getElementById(id);
            if (element) {
                element.textContent = value;
            }
        }

        function setPlaceholder(id, value) {
            var element = document.getElementById(id);
            if (element) {
                element.setAttribute('placeholder', value);
            }
        }

        function resolveErrorMessage(payload) {
            if (!payload) return '提交过程中发生错误。';
            if (payload.err_msg) return payload.err_msg;
            if (payload.validation_error) {
                if (payload.validation_error.body_params && payload.validation_error.body_params[0]) {
                    return payload.validation_error.body_params[0].msg;
                }
                if (payload.validation_error.query_params && payload.validation_error.query_params[0]) {
                    return payload.validation_error.query_params[0].msg;
                }
            }
            return '提交过程中发生错误。';
        }

        function showResult(kind, title, message, metaItems) {
            resultCard.className = 'result-card ' + kind;
            resultCard.style.display = 'block';
            resultTitle.textContent = title;
            resultBody.textContent = message;
            resultMeta.innerHTML = (metaItems || []).map(function(item) {
                return '<span class="meta-pill">' + escapeHtml(item) + '</span>';
            }).join('');
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            var div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }
    })();
    </script>
</body>
</html>
