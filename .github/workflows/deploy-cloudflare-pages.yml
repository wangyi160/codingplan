name: Deploy codingplan to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT || vars.CLOUDFLARE_PAGES_PROJECT || 'codingplan' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate Cloudflare config
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is required."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is required."
            exit 1
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p .cloudflare-pages
          rsync -a ./ .cloudflare-pages/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.cloudflare-pages' \
            --exclude '.playwright-snapshot-profile' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '.mypy_cache' \
            --exclude '.ruff_cache' \
            --exclude 'node_modules' \
            --exclude '.preview'

      - name: Deploy
        run: |
          npx wrangler@latest pages deploy .cloudflare-pages \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "${GITHUB_REF_NAME}"
