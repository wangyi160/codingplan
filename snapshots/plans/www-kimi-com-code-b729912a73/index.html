(() => {
  document.addEventListener('click', event => {
    const switchItem = event.target.closest('.switch-tab-item');
    if (!switchItem) return;

    const siblings = Array.from(switchItem.parentElement?.querySelectorAll('.switch-tab-item') || []);
    siblings.forEach(item => {
      const active = item === switchItem;
      item.classList.toggle('active', active);
      const tip = item.querySelector('.discount-tip');
      if (tip) tip.classList.toggle('discount-tip-active', active);
    });

    const background = switchItem.parentElement?.querySelector('.tab-item-background');
    const index = siblings.indexOf(switchItem);
    if (background && index >= 0) {
      background.style.transform = `translateX(${index * 100}%)`;
    }
  });
})();
