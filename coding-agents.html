<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle"></title>
    <link rel="icon" href="/favicon.ico?v=260418" type="image/x-icon">
    <link rel="stylesheet" href="styles/shared.css">
    <script src="scripts/shared.js"></script>
    <style>
        html { scroll-behavior: smooth; }

        .header .subtitle {
            width: min(980px, 100%);
            margin: 0 auto;
            text-wrap: balance;
        }

        .header h1 {
            text-wrap: balance;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .section-description {
            margin: -6px 0 18px;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .scope-card,
        .table-card,
        .notes-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
        }

        .scope-card {
            padding: 24px 28px;
            margin-bottom: 32px;
        }

        .scope-card ul {
            padding-left: 20px;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .scope-card li + li {
            margin-top: 6px;
        }

        .table-section {
            margin-bottom: 42px;
        }

        .table-card {
            overflow: hidden;
        }

        .table-wrapper {
            overflow-x: auto;
            overscroll-behavior-x: contain;
            scrollbar-gutter: stable both-edges;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1540px;
        }

        .comparison-table--plans {
            min-width: 1180px;
        }

        #agentsTable th:nth-child(1),
        #agentsTable td:nth-child(1) {
            min-width: 220px;
        }

        #agentsTable th:nth-child(2),
        #agentsTable td:nth-child(2) {
            min-width: 190px;
        }

        #agentsTable th:nth-child(4),
        #agentsTable td:nth-child(4),
        #agentsTable th:nth-child(8),
        #agentsTable td:nth-child(8) {
            min-width: 220px;
        }

        #agentsTable th:nth-child(5),
        #agentsTable td:nth-child(5),
        #agentsTable th:nth-child(6),
        #agentsTable td:nth-child(6),
        #agentsTable th:nth-child(9),
        #agentsTable td:nth-child(9),
        #agentsTable th:nth-child(10),
        #agentsTable td:nth-child(10),
        #agentsTable th:nth-child(11),
        #agentsTable td:nth-child(11) {
            min-width: 240px;
        }

        #plansTable th:nth-child(1),
        #plansTable td:nth-child(1) {
            min-width: 130px;
        }

        #plansTable th:nth-child(2),
        #plansTable td:nth-child(2) {
            min-width: 220px;
        }

        #plansTable th:nth-child(3),
        #plansTable td:nth-child(3) {
            min-width: 140px;
        }

        #plansTable th:nth-child(4),
        #plansTable td:nth-child(4),
        #plansTable th:nth-child(5),
        #plansTable td:nth-child(5),
        #plansTable th:nth-child(6),
        #plansTable td:nth-child(6),
        #plansTable th:nth-child(7),
        #plansTable td:nth-child(7) {
            min-width: 240px;
        }

        .comparison-table th,
        .comparison-table td {
            padding: 16px 14px;
            border-bottom: 1px solid var(--border-light);
            vertical-align: top;
            text-align: left;
        }

        .comparison-table th {
            position: sticky;
            top: 0;
            z-index: 1;
            background: #f8fbff;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.2px;
            text-transform: none;
            white-space: nowrap;
        }

        .comparison-table tbody tr:hover {
            background: rgba(99, 102, 241, 0.025);
        }

        .comparison-table tbody tr:last-child td {
            border-bottom: none;
        }

        .entity-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .text-stack,
        .meta-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .text-block {
            color: var(--text-secondary);
            line-height: 1.65;
        }

        .pill-list,
        .badge-list,
        .source-link-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pill,
        .status-pill,
        .source-pill {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            line-height: 1.4;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .pill {
            color: var(--text-secondary);
            background: var(--bg-tertiary);
            border-color: rgba(148, 163, 184, 0.18);
        }

        .status-pill--yes,
        .status-pill--mainlandYes,
        .source-pill--official {
            color: #166534;
            background: rgba(34, 197, 94, 0.12);
            border-color: rgba(34, 197, 94, 0.22);
        }

        .status-pill--no,
        .status-pill--mainlandNo {
            color: #991b1b;
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.22);
        }

        .status-pill--partial,
        .status-pill--mainlandPartial,
        .source-pill--secondary {
            color: #92400e;
            background: rgba(245, 158, 11, 0.12);
            border-color: rgba(245, 158, 11, 0.24);
        }

        .status-pill--unknown,
        .status-pill--na,
        .status-pill--mainlandUnknown,
        .source-pill--unknown {
            color: var(--text-secondary);
            background: rgba(148, 163, 184, 0.12);
            border-color: rgba(148, 163, 184, 0.22);
        }

        .source-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-primary);
            text-decoration: none;
            font-size: 12px;
            line-height: 1.5;
            padding: 4px 0;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .source-link:hover,
        .site-link:hover {
            text-decoration: underline;
        }

        .site-link {
            display: block;
            color: var(--accent-primary);
            text-decoration: none;
            line-height: 1.6;
            word-break: normal;
            overflow-wrap: anywhere;
        }

        .site-link-host {
            display: block;
            font-weight: 600;
        }

        .site-link-path {
            display: block;
            margin-top: 2px;
            color: var(--text-secondary);
            font-size: 12px;
            line-height: 1.5;
        }

        .compact-list {
            margin: 0;
            padding-left: 18px;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .compact-list li + li {
            margin-top: 4px;
        }

        .notes-card {
            padding: 24px 28px;
            margin-bottom: 28px;
        }

        .notes-card ul {
            padding-left: 20px;
            color: var(--text-secondary);
            line-height: 1.75;
        }

        .empty-state {
            padding: 24px;
            color: var(--text-secondary);
        }

        @media (max-width: 1024px) {
            body {
                padding: 28px 20px;
            }

            .header {
                padding: 32px 0;
            }

            .header h1 {
                font-size: 34px;
            }

            .github-link {
                position: static;
                margin-bottom: 18px;
            }

            .page-nav {
                overflow-x: auto;
                padding-bottom: 2px;
            }
        }

        @media (max-width: 640px) {
            .scope-card,
            .notes-card {
                padding: 18px 18px;
            }

            .table-wrapper {
                scrollbar-gutter: auto;
            }

            .comparison-table th,
            .comparison-table td {
                padding: 12px 10px;
            }

            .entity-name {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="page-nav">
            <a href="index.html" class="page-tab">Coding Plan</a>
            <a href="plan-usage.html" class="page-tab">Coding Plan用量提交</a>
            <a href="coding-agents.html" class="page-tab active">编程 Agent</a>
            <a href="relays.html" class="page-tab">中转站</a>
            <a href="relay-detect.html" class="page-tab">中转站检测</a>
            <div class="settings-wrapper">
                <button class="settings-btn" id="settingsBtn" title="设置" aria-label="设置">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
                <div class="settings-panel" id="settingsPanel" hidden>
                    <div class="settings-panel-title" id="settingsPanelTitle"></div>
                    <div class="settings-toggle-row">
                        <label for="ultraWideToggle" id="ultraWideLabel"></label>
                        <div class="toggle-switch">
                            <input type="checkbox" id="ultraWideToggle">
                            <label class="toggle-slider" for="ultraWideToggle"></label>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <header class="header">
            <a class="github-link" id="githubLink" href="https://github.com/wmpeng/codingplan" target="_blank" rel="noreferrer"></a>
            <h1 id="headerTitle"></h1>
            <div class="update-date" id="updateDate"></div>
            <p class="subtitle" id="headerSubtitle"></p>
        </header>

        <section class="scope-card">
            <div class="section-title" id="scopeTitle"></div>
            <p class="section-description" id="scopeDescription"></p>
            <ul id="scopeList"></ul>
        </section>

        <section class="table-section">
            <div class="section-title" id="agentsTableTitle"></div>
            <p class="section-description" id="agentsTableDescription"></p>
            <div class="table-card">
                <div class="table-wrapper">
                    <table class="comparison-table" id="agentsTable">
                        <thead>
                            <tr id="agentsTableHead"></tr>
                        </thead>
                        <tbody id="agentsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="table-section">
            <div class="section-title" id="plansTableTitle"></div>
            <p class="section-description" id="plansTableDescription"></p>
            <div class="table-card">
                <div class="table-wrapper">
                    <table class="comparison-table comparison-table--plans" id="plansTable">
                        <thead>
                            <tr id="plansTableHead"></tr>
                        </thead>
                        <tbody id="plansTableBody"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="notes-card" id="notesSection"></section>
    </div>

    <script>
        const CONFIG_FILE_PATH = './coding-agents-config.json';
        const DATA_FILE_PATH = './coding-agents-data.json';

        const AGENT_COLUMNS = [
            'name',
            'website',
            'formFactor',
            'modelSupport',
            'billingMode',
            'planSummary',
            'extraFeatures',
            'purchaseMethods',
            'regionRestriction',
            'supportsCustomApi',
            'remarks'
        ];

        const PLAN_COLUMNS = [
            'agentName',
            'planName',
            'price',
            'usageIncluded',
            'conversationEstimate',
            'extraFeatures',
            'remarks'
        ];

        let pageConfig = {};
        let pageData = {
            introNotes: [],
            agents: [],
            plans: [],
            notes: []
        };

        function safeUrl(url) {
            try {
                return new URL(url, window.location.href).href;
            } catch (error) {
                return '#';
            }
        }

        function formatWebsiteDisplay(url) {
            try {
                const parsed = new URL(url, window.location.href);
                const path = parsed.pathname && parsed.pathname !== '/'
                    ? parsed.pathname.replace(/\/$/, '')
                    : '';
                return {
                    host: parsed.host,
                    path
                };
            } catch (error) {
                return {
                    host: url || '—',
                    path: ''
                };
            }
        }

        function getConfigValue(path, fallback = '') {
            const parts = path.split('.');
            let current = pageConfig;
            for (const part of parts) {
                if (!current || !(part in current)) {
                    return fallback;
                }
                current = current[part];
            }
            return current ?? fallback;
        }

        function setText(id, value) {
            const element = document.getElementById(id);
            if (element) {
                element.textContent = value;
            }
        }

        function renderSimpleList(items) {
            if (!Array.isArray(items) || items.length === 0) {
                return '<span class="text-block">—</span>';
            }
            return `<ul class="compact-list">${items.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`;
        }

        function renderPills(items) {
            if (!Array.isArray(items) || items.length === 0) {
                return '<span class="text-block">—</span>';
            }
            return `<div class="pill-list">${items.map((item) => `<span class="pill">${escapeHtml(item)}</span>`).join('')}</div>`;
        }

        function renderSourceSummary(sources) {
            if (!Array.isArray(sources) || sources.length === 0) {
                return `<div class="meta-stack"><div class="badge-list"><span class="source-pill source-pill--unknown">${escapeHtml(getConfigValue('badges.unknown', '待核实'))}</span></div></div>`;
            }

            const seenTypes = new Set();
            const badges = [];
            sources.forEach((source) => {
                const type = source.type || 'unknown';
                if (!seenTypes.has(type)) {
                    seenTypes.add(type);
                    badges.push(`<span class="source-pill source-pill--${escapeHtml(type)}">${escapeHtml(getConfigValue(`badges.${type}`, type))}</span>`);
                }
            });

            const links = sources.map((source) => {
                const label = source.label || source.url || '来源';
                return `<a class="source-link" href="${escapeHtml(safeUrl(source.url || '#'))}" target="_blank" rel="noreferrer">${escapeHtml(label)}</a>`;
            }).join('');

            return `<div class="meta-stack"><div class="badge-list">${badges.join('')}</div><div class="source-link-list">${links}</div></div>`;
        }

        function renderStatusBlock(value, mainland = false) {
            if (!value || typeof value !== 'object') {
                return '<span class="text-block">—</span>';
            }

            const status = value.status || 'unknown';
            const badgeKeyMap = mainland
                ? {
                    yes: 'mainlandYes',
                    no: 'mainlandNo',
                    partial: 'mainlandPartial',
                    unknown: 'mainlandUnknown'
                }
                : {
                    yes: 'yes',
                    no: 'no',
                    partial: 'partial',
                    unknown: 'unknown',
                    na: 'na'
                };
            const badgeKey = badgeKeyMap[status] || 'unknown';
            return `
                <div class="text-stack">
                    <div class="badge-list">
                        <span class="status-pill status-pill--${escapeHtml(badgeKey)}">${escapeHtml(getConfigValue(`badges.${badgeKey}`, badgeKey))}</span>
                    </div>
                    <div class="text-block">${escapeHtml(value.text || '—')}</div>
                </div>
            `;
        }

        function renderNameCell(row) {
            return `
                <div class="text-stack">
                    <div class="entity-name">${escapeHtml(row.name)}</div>
                    ${renderSourceSummary(row.sources)}
                </div>
            `;
        }

        function renderPlanNameCell(row) {
            return `
                <div class="text-stack">
                    <div class="entity-name">${escapeHtml(row.planName)}</div>
                    ${renderSourceSummary(row.sources)}
                </div>
            `;
        }

        function renderWebsiteCell(url) {
            if (!url) {
                return '<span class="text-block">—</span>';
            }
            const display = formatWebsiteDisplay(url);
            return `
                <a class="site-link" href="${escapeHtml(safeUrl(url))}" target="_blank" rel="noreferrer" title="${escapeHtml(url)}">
                    <span class="site-link-host">${escapeHtml(display.host)}</span>
                    ${display.path ? `<span class="site-link-path">${escapeHtml(display.path)}</span>` : ''}
                </a>
            `;
        }

        function renderRegionCell(row) {
            return `
                <div class="text-stack">
                    ${renderStatusBlock(row.mainlandAvailability, true)}
                    <div class="text-block">${escapeHtml(row.regionRestriction || '—')}</div>
                </div>
            `;
        }

        function renderAgentsRow(row) {
            return `
                <tr>
                    <td>${renderNameCell(row)}</td>
                    <td>${renderWebsiteCell(row.website)}</td>
                    <td><div class="text-block">${escapeHtml(row.formFactor || '—')}</div></td>
                    <td>${renderPills(row.modelSupport)}</td>
                    <td><div class="text-block">${escapeHtml(row.billingMode || '—')}</div></td>
                    <td><div class="text-block">${escapeHtml(row.planSummary || '—')}</div></td>
                    <td>${renderSimpleList(row.extraFeatures)}</td>
                    <td>${renderPills(row.purchaseMethods)}</td>
                    <td>${renderRegionCell(row)}</td>
                    <td>${renderStatusBlock(row.supportsCustomApi)}</td>
                    <td>${renderSimpleList(row.remarks)}</td>
                </tr>
            `;
        }

        function renderPlansRow(row) {
            return `
                <tr>
                    <td><div class="text-block">${escapeHtml(row.agentName || '—')}</div></td>
                    <td>${renderPlanNameCell(row)}</td>
                    <td><div class="text-block">${escapeHtml(row.price || '—')}</div></td>
                    <td><div class="text-block">${escapeHtml(row.usageIncluded || '—')}</div></td>
                    <td><div class="text-block">${escapeHtml(row.conversationEstimate || '—')}</div></td>
                    <td>${renderSimpleList(row.extraFeatures)}</td>
                    <td>${renderSimpleList(row.remarks)}</td>
                </tr>
            `;
        }

        function renderTableHead(containerId, labels, columns) {
            const container = document.getElementById(containerId);
            container.innerHTML = columns.map((key) => `<th>${escapeHtml(labels[key] || key)}</th>`).join('');
        }

        function renderScopeCard() {
            const scopeItems = [
                ...(Array.isArray(getConfigValue('header.info', [])) ? getConfigValue('header.info', []) : []),
                ...(Array.isArray(pageData.introNotes) ? pageData.introNotes : [])
            ];
            const scopeList = document.getElementById('scopeList');
            scopeList.innerHTML = scopeItems.map((item) => `<li>${escapeHtml(item)}</li>`).join('');
        }

        function renderAgentsTable() {
            const tbody = document.getElementById('agentsTableBody');
            const agents = Array.isArray(pageData.agents)
                ? [...pageData.agents].sort((left, right) => (left.sortOrder || 0) - (right.sortOrder || 0))
                : [];

            if (agents.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${AGENT_COLUMNS.length}" class="empty-state">${escapeHtml(getConfigValue('messages.emptyAgents', '暂无工具数据。'))}</td></tr>`;
                return;
            }

            tbody.innerHTML = agents.map(renderAgentsRow).join('');
        }

        function renderPlansTable() {
            const tbody = document.getElementById('plansTableBody');
            const plans = Array.isArray(pageData.plans)
                ? [...pageData.plans].sort((left, right) => {
                    if ((left.agentSortOrder || 0) !== (right.agentSortOrder || 0)) {
                        return (left.agentSortOrder || 0) - (right.agentSortOrder || 0);
                    }
                    return (left.planSortOrder || 0) - (right.planSortOrder || 0);
                })
                : [];

            if (plans.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${PLAN_COLUMNS.length}" class="empty-state">${escapeHtml(getConfigValue('messages.emptyPlans', '暂无套餐数据。'))}</td></tr>`;
                return;
            }

            tbody.innerHTML = plans.map(renderPlansRow).join('');
        }

        function renderNotes() {
            const notesSection = document.getElementById('notesSection');
            const title = escapeHtml(getConfigValue('sections.notesTitle', '说明'));
            const notes = Array.isArray(pageData.notes) ? pageData.notes : [];
            notesSection.innerHTML = `
                <div class="section-title">${title}</div>
                <ul>${notes.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ul>
            `;
        }

        function applyConfig() {
            document.title = getConfigValue('pageTitle', '编程 Agent 对比');
            setText('pageTitle', getConfigValue('pageTitle', '编程 Agent 对比'));
            setText('headerTitle', getConfigValue('header.title', '编程 Agent 对比'));
            setText('updateDate', getConfigValue('header.updateDate', ''));
            setText('headerSubtitle', getConfigValue('header.subtitle', ''));
            setText('settingsPanelTitle', getConfigValue('settings.panelTitle', '显示设置'));
            setText('ultraWideLabel', getConfigValue('settings.ultraWideLabel', '超宽屏模式'));
            setText('scopeTitle', getConfigValue('sections.scopeTitle', '口径说明'));
            setText('scopeDescription', getConfigValue('sections.scopeDescription', ''));
            setText('agentsTableTitle', getConfigValue('sections.agentsTableTitle', '工具总表'));
            setText('agentsTableDescription', getConfigValue('sections.agentsTableDescription', ''));
            setText('plansTableTitle', getConfigValue('sections.plansTableTitle', '套餐订阅表'));
            setText('plansTableDescription', getConfigValue('sections.plansTableDescription', ''));

            const githubLink = document.getElementById('githubLink');
            githubLink.textContent = getConfigValue('header.githubText', 'GitHub');
        }

        async function loadConfig() {
            const response = await fetch(CONFIG_FILE_PATH, { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            pageConfig = await response.json();
        }

        async function loadData() {
            const response = await fetch(DATA_FILE_PATH, { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            pageData = await response.json();
        }

        function renderLoadError() {
            const message = escapeHtml(getConfigValue('messages.loadError', '数据加载失败，请稍后重试。'));
            document.getElementById('agentsTableBody').innerHTML = `<tr><td colspan="${AGENT_COLUMNS.length}" class="empty-state">${message}</td></tr>`;
            document.getElementById('plansTableBody').innerHTML = `<tr><td colspan="${PLAN_COLUMNS.length}" class="empty-state">${message}</td></tr>`;
        }

        async function init() {
            renderTableHead('agentsTableHead', getConfigValue('tableLabels.agents', {}), AGENT_COLUMNS);
            renderTableHead('plansTableHead', getConfigValue('tableLabels.plans', {}), PLAN_COLUMNS);

            document.getElementById('agentsTableBody').innerHTML = `<tr><td colspan="${AGENT_COLUMNS.length}" class="empty-state">${escapeHtml(getConfigValue('messages.loading', '加载中...'))}</td></tr>`;
            document.getElementById('plansTableBody').innerHTML = `<tr><td colspan="${PLAN_COLUMNS.length}" class="empty-state">${escapeHtml(getConfigValue('messages.loading', '加载中...'))}</td></tr>`;

            try {
                await loadConfig();
                applyConfig();
                renderTableHead('agentsTableHead', getConfigValue('tableLabels.agents', {}), AGENT_COLUMNS);
                renderTableHead('plansTableHead', getConfigValue('tableLabels.plans', {}), PLAN_COLUMNS);
                await loadData();
                renderScopeCard();
                renderAgentsTable();
                renderPlansTable();
                renderNotes();
            } catch (error) {
                renderLoadError();
            }
        }

        init();
    </script>
</body>
</html>
